# Fly.io deployment for Bridge RNA. Reasoning is in docs/deployment.md.

app = 'bridge-rna'
primary_region = 'sjc'  # the closest Fly region to Ames

[build]

[env]
  # The app reads artifacts relative to the repository root, which is /app here.
  BRIDGE_RNA_ROOT = '/app'
  # Ollama does not exist in this container, so the summary button reports that
  # it could not reach a provider. Set AI_SUMMARY_PROVIDER=bedrock plus the
  # BEDROCK_* secrets to point it at a real one; no image change is needed.
  AI_SUMMARY_PROVIDER = 'ollama'

[http_service]
  internal_port = 8050
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Idle machines stop and the next request starts one, which costs roughly
  # fifteen seconds on a cold hit and most of the monthly bill otherwise.
  # Before a live demo, pin one warm:  fly scale count 1 --region sjc
  # and set min_machines_running = 1 here.
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    # These were 4 and 8, sized to the worker's thread count, and that was
    # wrong in a way worth recording. A live upload embed holds one thread for
    # minutes while the browser keeps firing short Dash callbacks, so the
    # in-flight count sails past eight and the proxy starts *rejecting* rather
    # than queuing. A rejected callback is a figure that never updates, which
    # showed up as an uploaded search appearing to return the previous
    # column's result.
    #
    # A limit here should describe when to shed load, not mirror the thread
    # pool. Dash callbacks are short and numerous; one of them being slow is
    # not a reason to turn the others away.
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  # Dedicated CPU, not shared, and the upload path is what forces it. A
  # shared-cpu-2x was measured serving one live embed in 13m36s wall for 1m55s
  # of CPU - 14% utilization, which is Fly throttling a shared vCPU to its
  # sustained baseline once burst credits are gone. The same embed is 10.4s on
  # a laptop. The map and cached retrieval were tolerable there; the embed was
  # not, and a 13-minute upload is a broken feature rather than a slow one.
  size = 'performance-2x'
  # Peak resident memory measured at 1,852 MB with every coordinate set, the
  # tissue color-by and a cached retrieval live in one process. The headroom is
  # for the upload path's torch subprocess, measured at 1,036 MB resident
  # alongside it.
  memory = '4gb'
  cpus = 2
  processes = ['app']
